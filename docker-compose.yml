# Ambiente com PostgreSQL real. Uso: copie .env.example para .env, preencha os segredos e rode `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ppcm
      POSTGRES_USER: ppcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppcm -d ppcm"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://ppcm:${POSTGRES_PASSWORD}@db:5432/ppcm
      STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
